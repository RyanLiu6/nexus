services:
  tailscale-proton:
    image: tailscale/tailscale:latest
    container_name: tailscale-proton
    network_mode: "service:gluetun"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      - TS_HOSTNAME=ProtonVPN
      - TS_AUTHKEY=${PROTON_TAILSCALE_AUTHKEY:-}
      - TS_EXTRA_ARGS=--login-server=https://headscale.${NEXUS_DOMAIN} --advertise-exit-node
    entrypoint: ["/entrypoint.sh"]
    volumes:
      - ${NEXUS_DATA_DIRECTORY}/Config/tailscale-proton:/var/lib/tailscale
      - ${NEXUS_ROOT_DIRECTORY}/services/tailscale-proton/entrypoint.sh:/entrypoint.sh:ro
    restart: unless-stopped
    depends_on:
      gluetun:
        condition: service_healthy
