http:
  routers:
    transmission:
      rule: "Host(`transmission.{{ env `NEXUS_DOMAIN` }}`)"
      entryPoints:
        - "https"
      middlewares:
        - "authentik-chain@file"
      service: "transmission"
      tls:
        certResolver: "certchallenge"

    transmission-http:
      rule: "Host(`transmission.{{ env `NEXUS_DOMAIN` }}`)"
      entryPoints:
        - "http"
      middlewares:
        - "redirect-to-https@file"
      service: "transmission"

  services:
    transmission:
      loadBalancer:
        servers:
          - url: "http://gluetun:9091"
        passHostHeader: true
