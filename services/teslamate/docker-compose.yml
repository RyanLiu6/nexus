services:
  teslamate:
    image: teslamate/teslamate:latest
    container_name: teslamate
    restart: unless-stopped
    cap_drop:
      - all
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    networks:
      - nexus
      - teslamate
    environment:
      ENCRYPTION_KEY: ${TESLAMATE_ENCRYPTION_KEY}
      DATABASE_USER: ${TESLAMATE_POSTGRES_USER}
      DATABASE_PASS: ${TESLAMATE_POSTGRES_PASSWORD}
      DATABASE_NAME: ${TESLAMATE_POSTGRES_DB}
      DATABASE_HOST: teslamate-db
      MQTT_HOST: ${TESLAMATE_MQTT_HOST}
      MQTT_PORT: 1883
      MQTT_USERNAME: ${TESLAMATE_MQTT_USERNAME}
      MQTT_PASSWORD: ${TESLAMATE_MQTT_PASSWORD}
      VIRTUAL_HOST: teslamate.${NEXUS_DOMAIN}
      CHECK_ORIGIN: "true"
      TZ: ${TZ}
    depends_on:
      teslamate-db:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=nexus"
      - "traefik.http.services.teslamate.loadbalancer.server.port=4000"
      - "traefik.http.routers.teslamate.rule=Host(`teslamate.${NEXUS_DOMAIN}`)"
      - "traefik.http.routers.teslamate.entrypoints=https"
      - "traefik.http.routers.teslamate.middlewares=internal-chain@file"
      - "traefik.http.routers.teslamate.tls=true"
      - "traefik.http.routers.teslamate.tls.certresolver=certchallenge"

  teslamate-db:
    image: postgres:19
    container_name: teslamate-db
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    networks:
      - teslamate
    volumes:
      - ${NEXUS_DATA_DIRECTORY}/Config/teslamate/postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${TESLAMATE_POSTGRES_USER}
      POSTGRES_PASSWORD: ${TESLAMATE_POSTGRES_PASSWORD}
      POSTGRES_DB: ${TESLAMATE_POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  nexus:
    external: true
  teslamate:
    name: nexus_teslamate
    driver: bridge
