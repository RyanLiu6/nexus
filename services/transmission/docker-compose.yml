services:
  transmission:
    image: lscr.io/linuxserver/transmission:4.1.3
    container_name: transmission
    restart: unless-stopped
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    volumes:
      - ${NEXUS_DATA_DIRECTORY}/Config/transmission:/config
      - ${NEXUS_DATA_DIRECTORY}/Media:/downloads
      - ${NEXUS_DATA_DIRECTORY}/Media/queue:/watch
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ}
      - DOCKER_MODS=linuxserver/mods:transmission-floodui
      - NEXUS_ROOT_DIRECTORY=${NEXUS_ROOT_DIRECTORY}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/transmission/web/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
