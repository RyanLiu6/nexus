services:
  virtue:
    image: lscr.io/linuxserver/jellyfin:10.11.11
    container_name: virtue
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
        reservations:
          memory: 512M
    networks:
      - nexus
    volumes:
      - ${NEXUS_DATA_DIRECTORY}/Config/virtue:/config
      - ${NEXUS_DATA_DIRECTORY}/Media:/data/media
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ}
      - JELLYFIN_PublishedServerUrl=https://virtue.${NEXUS_DOMAIN}
      - NEXUS_ROOT_DIRECTORY=${NEXUS_ROOT_DIRECTORY}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8096/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=nexus"
      - "traefik.http.services.virtue.loadbalancer.server.port=8096"
      # HTTPS only - Tailscale access only
      # Note: Jellyfin has its own user auth; can add tsidp OAuth via SSO plugin
      - "traefik.http.routers.virtue.rule=Host(`virtue.${NEXUS_DOMAIN}`)"
      - "traefik.http.routers.virtue.entrypoints=https"
      - "traefik.http.routers.virtue.middlewares=tailscale-chain@file"
      - "traefik.http.routers.virtue.tls=true"
      - "traefik.http.routers.virtue.tls.certresolver=certchallenge"

networks:
  nexus:
    external: true
