services:
  bookorbit:
    image: ghcr.io/bookorbit/bookorbit:latest
    container_name: bookorbit
    restart: unless-stopped
    init: true
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M
    networks:
      - nexus
      - bookorbit
    volumes:
      - ${NEXUS_DATA_DIRECTORY}/Config/bookorbit/data:/data
      - ${BOOKORBIT_BOOKS_DIRECTORY}:/books
    environment:
      NODE_ENV: production
      PORT: 3000
      POSTGRES_HOST: bookorbit-db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${BOOKORBIT_POSTGRES_USER}
      POSTGRES_PASSWORD: ${BOOKORBIT_POSTGRES_PASSWORD}
      POSTGRES_DB: ${BOOKORBIT_POSTGRES_DB}
      JWT_SECRET: ${BOOKORBIT_JWT_SECRET}
      SETUP_BOOTSTRAP_TOKEN: ${BOOKORBIT_SETUP_BOOTSTRAP_TOKEN}
      APP_URL: https://bookorbit.${NEXUS_DOMAIN}
      CLIENT_URL: https://bookorbit.${NEXUS_DOMAIN}
      TZ: ${TZ}
      PUID: ${PUID}
      PGID: ${PGID}
    depends_on:
      bookorbit-db:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=nexus"
      - "traefik.http.services.bookorbit.loadbalancer.server.port=3000"
      - "traefik.http.routers.bookorbit.rule=Host(`bookorbit.${NEXUS_DOMAIN}`)"
      - "traefik.http.routers.bookorbit.entrypoints=https"
      - "traefik.http.routers.bookorbit.middlewares=tailscale-chain@file"
      - "traefik.http.routers.bookorbit.tls=true"
      - "traefik.http.routers.bookorbit.tls.certresolver=certchallenge"

  bookorbit-db:
    image: pgvector/pgvector:pg18
    container_name: bookorbit-db
    restart: unless-stopped
    shm_size: 256m
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    networks:
      - bookorbit
    volumes:
      - ${NEXUS_DATA_DIRECTORY}/Config/bookorbit/postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${BOOKORBIT_POSTGRES_USER}
      POSTGRES_PASSWORD: ${BOOKORBIT_POSTGRES_PASSWORD}
      POSTGRES_DB: ${BOOKORBIT_POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  nexus:
    external: true
  bookorbit:
    name: nexus_bookorbit
    driver: bridge
