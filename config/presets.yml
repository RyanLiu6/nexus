# Nexus Deployment Presets
#
# Presets define groups of services that are commonly deployed together.
# Use with: nexus deploy --preset <name>

core:
  - traefik
  - headscale
  - dashboard
  - monitoring
  - homeassistant
  - scrypted

home:
  extends: core
  services:
    - backups
    - paperless
    - bookorbit
    - foundryvtt
    - jellyfin
    - gluetun
    - transmission
    - authentik
    - tailscale-proton
