name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Check with ruff
        run: uv run ruff check src/ scripts/

      - name: Check formatting with ruff
        run: uv run ruff format --check src/ scripts/

      - name: Type check with mypy
        run: uv run mypy src/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run tests with coverage
        run: |
          uv run pytest \
            --cov=src/nexus \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=90 \
            --junitxml=test-results.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  docker-compose-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate Docker Compose files
        env:
          NEXUS_ROOT_DIRECTORY: /tmp/nexus
          NEXUS_DATA_DIRECTORY: /tmp/nexus/data
          NEXUS_USERDATA_DIRECTORY: /tmp/nexus/userdata
          BOOKORBIT_BOOKS_DIRECTORY: /tmp/nexus/books
          FOUNDRYVTT_DATA_DIRECTORY: /tmp/nexus/foundryvtt
          PAPERLESS_DOCUMENTS_DIRECTORY: /tmp/nexus/paperless
          SURE_DATA_DIRECTORY: /tmp/nexus/sure
          TZ: UTC
          RESTIC_PASSWORD: dummy
        run: |
          for file in services/*/docker-compose.yml; do
            echo "Validating $file..."
            if [ -f services/gluetun/docker-compose.yml ] && grep -q "gluetun" "$file" && [ "$file" != "services/gluetun/docker-compose.yml" ]; then
              docker compose -f services/gluetun/docker-compose.yml -f "$file" config --quiet
            else
              docker compose -f "$file" config --quiet
            fi
          done

  opentofu-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v2

      - name: OpenTofu Init
        run: tofu -chdir=terraform init -backend=false

      - name: OpenTofu Validate
        run: tofu -chdir=terraform validate
